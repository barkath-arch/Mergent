<!DOCTYPE html><html><body style="margin:0;padding:0;background:#06070d;color:#e6e7f0;font-family:-apple-system,Segoe UI,sans-serif;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#06070d;padding:36px 16px;">
  <tr><td align="center">
    <table role="presentation" cellpadding="0" cellspacing="0" width="560" style="background:#0b0d18;border:1px solid rgba(140,146,200,0.16);border-radius:14px;overflow:hidden;">
      <tr><td style="background:linear-gradient(180deg,#8b5cf6,#7c3aed);padding:24px 28px;">
        <div style="font-size:18px;font-weight:600;letter-spacing:-0.01em;color:#ffffff;">Mergent</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.7);letter-spacing:.08em;text-transform:uppercase;">{header_tag}</div>
      </td></tr>
      <tr><td style="padding:32px 28px;color:#e6e7f0;font-size:14.5px;line-height:1.65;">
        <h1 style="font-size:22px;margin:0 0 12px;letter-spacing:-0.01em;color:#e6e7f0;">{title}</h1>
        <p style="margin:0 0 16px;color:#9aa0bd;">{intro}</p>
        {body_html}
        <p style="margin:24px 0 0;"><a href="{cta_url}" style="display:inline-block;padding:11px 20px;background:linear-gradient(180deg,#8b5cf6,#7c3aed);color:#ffffff;text-decoration:none;border-radius:10px;font-weight:500;font-size:14px;">{cta_label}</a></p>
      </td></tr>
      <tr><td style="padding:18px 28px;border-top:1px solid rgba(140,146,200,0.16);font-size:11.5px;color:#6b7090;">
        <p style="margin:0 0 6px;">Sent by Mergent · Find. Acquire. Deploy.</p>
        <p style="margin:0;">{unsubscribe_html}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
